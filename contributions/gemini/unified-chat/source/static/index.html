<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Glance · 프로젝트 워크룸</title><link rel="icon" href="/glance-logo.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"></head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="Glance 홈"><img class="brand-logo" src="/glance-logo.svg" alt=""><span>Glance</span></a>
    <div class="workspace-label"><span class="tiny-dot green"></span> WORKSPACE <span class="local-tag">LOCAL</span></div>
    <div class="sidebar-heading">프로젝트 <span id="project-count">01</span></div>
    <div id="project-list" class="project-list"></div>
    <div class="sidebar-heading tasks-heading">이 프로젝트의 작업 <span id="task-count">00</span></div>
    <nav id="task-list" class="task-list" aria-label="작업 선택"></nav>
    <div class="sidebar-bottom"><img class="small-logo" src="/glance-logo.svg" alt=""><div><strong>로컬 작업실</strong></div><span class="tiny-dot green"></span></div>
  </aside>
  <div class="main-shell">
    <header class="topbar"><div class="breadcrumb">워크스페이스 <span>/</span> <strong id="breadcrumb-project">프로젝트</strong></div><div class="topbar-right"><span class="privacy"><span class="tiny-dot green"></span> 로컬 저장</span><button id="connections-button" class="icon-button" aria-label="연결 정보">⌘</button></div></header>
    <section class="project-header"><div><h1 id="project-title">Glance</h1><p id="project-description" hidden></p></div><div class="project-header-actions"><div class="view-toggle" role="group" aria-label="작업실 보기"><button id="chat-toggle" class="active" aria-pressed="true"><span>☷</span> 대화</button><button id="world-toggle" aria-pressed="false"><span>◇</span> 월드</button></div><span id="project-status" class="status-badge">준비</span><button id="evidence-button" class="button secondary">↗ 프로젝트 기록</button></div></section>
    <div class="work-area">
      <main class="workspace">
        <div class="workspace-toolbar"><div class="toolbar-meta"><span id="state-connection" class="connection-state">연결 중</span><button id="refresh-button" class="text-button" aria-label="상태 새로고침">↻</button></div></div>
        <div class="agent-strip" id="agent-strip"></div>
        <div id="mode-notice" class="mode-notice"><span class="tiny-dot"></span><span>로컬</span></div>
        <div id="storage-notice" class="storage-notice" role="alert" hidden></div>
        <section id="chat-view" class="chat-view" aria-label="프로젝트 대화">
          <div class="conversation-top"><span class="section-caption">3개 제공자 통합 대화 · 교차 검토</span><span id="message-count"></span></div>
          <div id="provider-run-board" class="provider-run-board" aria-label="제공자별 독립 실행 상태"></div>
          <div id="messages" class="messages" aria-live="polite"></div>
        </section>
        <section id="world-view" class="world-view" hidden aria-label="프로젝트 월드"><div class="world-heading"><div><h2>프로젝트 월드</h2></div><span class="world-live"><span class="tiny-dot"></span><span id="world-status">대기 중</span></span></div><div class="world-tools"><span id="world-renderer-mode" class="provenance">2D 대체 보기</span><div class="camera-controls" role="group" aria-label="3D 카메라"><button type="button" data-camera="left" aria-label="왼쪽 시점">↶</button><button type="button" data-camera="center">기본 시점</button><button type="button" data-camera="right" aria-label="오른쪽 시점">↷</button></div><details class="renderer-details"><summary>렌더링 정보</summary><button id="refresh-renderer-info" class="text-link" type="button">정보 갱신</button><pre id="world-renderer-diagnostics" class="detail-output">아직 3D를 시작하지 않았습니다.</pre></details></div><div class="world-stage" id="world-stage"><svg id="world" viewBox="0 0 1000 575" role="img" aria-label="검증된 작업 결과를 블록으로 보여 주는 프로젝트 월드"></svg><div class="world-hint">선택하여 기록 보기</div></div><div id="world-accessible-controls" class="world-accessible-controls" role="group" aria-label="월드 항목 선택"></div><div class="world-legend"><span><i class="legend-square verified"></i> 검증 결과 <strong id="verified-count">0</strong></span><span><i class="legend-square fixture"></i> 기본 시설</span><span><i class="legend-square ephemeral"></i> 활동</span></div></section>
        <div id="cross-review-context" class="reply-context cross-review-banner" hidden></div>
        <div id="reply-context" class="reply-context" hidden></div>
        <div id="upload-status" class="upload-status" hidden></div>
        <form id="message-form" class="composer">
          <div class="composer-providers" id="composer-providers" role="group" aria-label="전송 대상 제공자 선택">
            <span class="composer-providers-label">대상 제공자 선택:</span>
            <label class="provider-check"><input type="checkbox" value="codex" checked data-provider-select="codex"><span>ChatGPT <small>(codex_dot)</small></span></label>
            <label class="provider-check"><input type="checkbox" value="claude" checked data-provider-select="claude"><span>Claude <small>(claude)</small></span></label>
            <label class="provider-check"><input type="checkbox" value="antigravity" checked data-provider-select="antigravity"><span>Gemini <small>(antigravity)</small></span></label>
            <span class="composer-mode-tag" title="외부 제공자 실호출은 승인 전까지 비활성이며 로컬 합성 어댑터로 동작합니다.">모의 실행 (외부 API 호출 0회)</span>
          </div>
          <label for="message-input" class="sr-only">프로젝트에 메시지 보내기</label>
          <textarea id="message-input" rows="2" placeholder="선택한 제공자에게 동시에 보낼 질문이나 작업 요청을 입력하세요 (교차 검토 선택 시 추가 검토 메모 입력 가능)"></textarea>
          <div class="composer-bottom"><div><button type="button" id="upload-button" class="attach-button" aria-label="작은 텍스트 파일 첨부">＋</button><span>텍스트 파일 첨부 <span class="keyboard-hint">· Enter 전송 / Shift + Enter 줄바꿈</span></span><input type="file" id="file-input" accept=".txt,.md,.json,.csv,.log,.py,.js,.html,.css" hidden></div><button type="submit" id="send-button" class="button send">선택 제공자에게 보내기 <span>↑</span></button></div>
        </form>
      </main>
      <aside class="inspector" aria-label="작업 정보"><div class="inspector-header"><span id="inspector-heading">작업 브리핑</span><span class="small-cross">✦</span></div><div id="inspector-content" class="inspector-content"></div></aside>
    </div>
  </div>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="connections-dialog"><div class="dialog-heading"><div><h2>에이전트 연결</h2></div><button id="close-connections" class="icon-button" aria-label="닫기">×</button></div><div id="connections-content"></div></dialog>
<script src="/world3d.js"></script><script src="/app.js"></script>
</body></html>
